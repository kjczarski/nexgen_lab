demo_scenario:
  requirements: |
    We need to build a cross-functional drug discovery team for a new kinase inhibitor program with the following requirements:
    - Medicinal chemistry expertise in kinase inhibitor design and structure-based drug discovery
    - Biology capabilities for target validation and mechanism of action studies
    - Computational chemistry support for molecular modeling and property predictions
    - DMPK expertise for ADME optimization and brain penetration studies
    - Experience with PROTAC design and degradation assays
    - Strong track record in oncology drug discovery programs
    
    Looking for 5 people who can handle the full drug discovery pipeline,
    from target validation through lead optimization to preclinical candidate selection.
  
  team_size: 5
