# Unified experimental protocols

standard_assays:
  proliferation:
    - name: "CyQUANT"
      duration: "5 days (120h)"
      dose_range: "10-point, 4-fold dilution"
      readout: "GI50, IC50"
      papers: ["PAPER-002"]
      nexgen_implementation: "EMP004"  # Rachel Foster
      
    - name: "IncuCyte"
      duration: "Until 100% confluence"
      readout: "Real-time confluence"
      papers: ["PAPER-002"]
      nexgen_implementation: "EMP004"  # Rachel Foster
  
  target_engagement:
    - name: "AlphaLISA (pRb)"
      sites: "Thr821/826 (CDK2), Ser807/811 (CDK4/6)"
      lysate: "5 μg"
      papers: ["PAPER-001", "PAPER-002"]
      nexgen_implementation: "EMP004"  # Rachel Foster
      
    - name: "NanoBRET"
      readout: "Kinase occupancy"
      papers: ["PAPER-002"]
      nexgen_implementation: "EMP004"  # Rachel Foster
  
  degradation:
    - name: "Western blot time course"
      timepoints: "0-24h"
      readout: "Protein levels, DC50, Dmax"
      papers: ["PAPER-004"]
      nexgen_implementation: "EMP002"  # Jennifer Martinez
      
    - name: "Proteomic profiling (TMT-MS)"
      purpose: "Selectivity, off-targets"
      papers: ["PAPER-004"]
      nexgen_implementation: "EMP002"  # Jennifer Martinez
  
  permeability:
    - name: "Caco-2"
      readout: "Papp (A-B, B-A), efflux ratio"
      papers: ["PAPER-001"]
      nexgen_implementation: "EMP010"  # Jonathan Hughes
      
    - name: "MDCK-MDR1"
      readout: "P-gp efflux"
      papers: ["PAPER-001"]
      nexgen_implementation: "EMP010"  # Jonathan Hughes
  
  in_vivo:
    - name: "CDX efficacy"
      dosing: "PO, b.i.d. or q.d."
      duration: "2-8 weeks"
      readout: "Tumor volume, TGI%"
      papers: ["PAPER-001", "PAPER-002", "PAPER-004"]
      nexgen_implementation: "EMP004"  # Rachel Foster
      
    - name: "PDX efficacy"
      models: "Patient-derived, biomarker-stratified"
      readout: "TGI%, biomarker correlation"
      papers: ["PAPER-001", "PAPER-002"]
      nexgen_implementation: "EMP004"  # Rachel Foster
      
    - name: "Brain penetration PK"
      sampling: "7 timepoints, n=3/timepoint"
      readout: "Brain:plasma, Kp,uu"
      papers: ["PAPER-001"]
      nexgen_implementation: "EMP010"  # Jonathan Hughes

