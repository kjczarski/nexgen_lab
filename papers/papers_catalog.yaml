  - id: "PAPER-001"
    title: "Discovery of a Hydroxylamine-Based Brain-Penetrant EGFR Inhibitor for Metastatic Non-Small-Cell Lung Cancer"
    authors: "Hill J, Jones RM, Crich D"
    journal: "J Med Chem"
    year: 2023
    doi: "10.1021/acs.jmedchem.3c01669"
    filename: "jm3c01669.pdf"
    
    summary: "Brain-penetrant EGFR inhibitor using hydroxylamine bioisostere. Active against osimertinib-resistant NSCLC with CNS metastases."
    
    key_compound:
      name: "Compound 9"
      target: "EGFR"
      potency: "IC50 3-7 nM (cell lines)"
      selectivity: "12-33× vs EGFR-WT"
      key_property: "Brain Kp,uu 0.33-0.45, low efflux"
    
    relevance_to_nexgen:
      program: "EGFR Program (NGT-147)"
      researchers: ["EMP001", "EMP006", "EMP010", "EMP004"]  # Sarah Chen, Linda Wu, Jonathan Hughes, Rachel Foster
      application: "Brain penetration strategy, efflux optimization"
      connections:
        - "lab_data/experiments/NGT-147_synthesis_log_2025-03-12.txt"
        - "lab_data/experiments/DMPK_brain_penetration_study_2025-04-15.txt"
        - "lab_data/communications/NGT-147_crystal_structure_email_2025-03-20.txt"
    
    key_methods:
      - "N-O bond formation synthesis (multigram scale)"
      - "Caco-2 and MDCK-MDR1 permeability assays"
      - "Brain:plasma ratio PK studies"
      - "Intracranial PDX efficacy (HCC827-luc)"
    
    key_findings:
      - "Hydroxylamine reduces pKa, improves BBB penetration"
      - "14× better Caco-2 permeability vs gefitinib"
      - "Active vs L858R/C797S and del19/C797S mutations"
      - "Non-mutagenic, non-genotoxic"
    
    tags: ["EGFR", "brain-penetration", "bioisostere", "osimertinib-resistant", "CNS-metastases"]
    
    actionable_steps:
      - step: "Implement hydroxylamine bioisostere synthesis"
        priority: "High"
        owner: "EMP001"  # Sarah Chen
        timeline: "2-3 weeks"
        resources: ["Medicinal Chemistry Lab", "Synthesis protocols"]
        expected_outcome: "NGT-147 analogs with improved brain penetration"
        
      - step: "Set up Caco-2/MDCK-MDR1 permeability assays"
        priority: "High"
        owner: "EMP010"  # Jonathan Hughes
        timeline: "1-2 weeks"
        resources: ["DMPK Lab", "Cell culture facilities"]
        expected_outcome: "Standardized permeability screening protocol"
        
      - step: "Design brain penetration PK study for NGT-147"
        priority: "Medium"
        owner: "EMP010"  # Jonathan Hughes
        timeline: "3-4 weeks"
        resources: ["Animal facility", "LCMS equipment"]
        expected_outcome: "Kp,uu values for NGT-147 and analogs"

  - id: "PAPER-002"
    title: "BLU-222 CDK2 Inhibitor in CCNE1-Aberrant Ovarian/Endometrial Tumors"
    authors: "House NC, Brown VE, Chen M, et al"
    journal: "Cancer Res"
    year: 2025
    doi: "10.1158/0008-5472.CAN-24-2360"
    filename: "can-24-2360.pdf"
    
    summary: "Selective CDK2 inhibitor with biomarker signature (CCNE1/Rb/p16) for patient selection. Effective combinations with CDK4/6i and chemotherapy."
    
    key_compound:
      name: "BLU-222"
      target: "CDK2"
      potency: "IC50 2.6 nM (enzymatic), 4.2 nM (cellular)"
      selectivity: ">90× vs CDK1, >400× vs CDK4/6"
      key_property: "S(10) 0.045 kinome selectivity"
    
    relevance_to_nexgen:
      program: "CDK2 Program"
      researchers: ["EMP001", "EMP004", "EMP006", "EMP015"]  # Sarah Chen, Rachel Foster, Linda Wu, Amit Patel
      application: "Biomarker-driven patient selection, combination strategies"
      connections:
        - "lab_data/projects/CDK2_HTS_results_summary_2025-08-28.md"
        - "lab_data/meetings/CDK2_hit_to_lead_meeting_2025-09-10.md"
        - "lab_data/experiments/CDK2_compound_screening_batch_47.csv"
    
    key_methods:
      - "CRISPR whole-genome screen (80K library, 100M cells)"
      - "CyQUANT proliferation (5-day, 10-point dose)"
      - "AlphaLISA pRb phosphorylation (Thr821/826, Ser807/811)"
      - "PDX studies with biomarker stratification"
      - "SynergyFinder combination analysis"
    
    key_findings:
      - "Biomarker signature: CCNE1-high + Rb-intact + p16-high (monotherapy)"
      - "p16-low tumors respond to BLU-222 + CDK4/6i (ribociclib)"
      - "Chemosensitization: BLU-222 + carboplatin/paclitaxel overcomes resistance"
      - "RB1 and CDKN2A knockouts confer resistance"
    
    tags: ["CDK2", "CCNE1", "biomarker-signature", "Rb", "p16", "ribociclib", "chemotherapy-combination"]
    
