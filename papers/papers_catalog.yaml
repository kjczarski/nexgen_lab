  - id: "PAPER-004"
    title: "Molecular Glues Targeting BTK for Degradation"
    authors: "Henning NJ, Boike L, Spradlin JN, et al"
    journal: "Nature"
    year: 2025
    doi: "10.1038/s41586-025-09000-3"
    filename: "41586_2025_Article_9000.pdf"
    
    summary: "Discovery of NRX-0492 molecular glue that induces BTK degradation via CRBN E3 ligase. Active in ibrutinib-resistant CLL/MCL, spares wild-type BTK in healthy B cells."
    
    key_compound:
      name: "NRX-0492"
      target: "BTK (degradation)"
      potency: "DC50 10-20 nM (cell lines), Dmax >90%"
      selectivity: "Spares BTK-WT, selective for C481S mutant"
      key_property: "Oral bioavailable, tumor regression in vivo"
    
